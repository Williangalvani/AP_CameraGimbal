# camera-app configuration
#
# Hi3516DV500 (IMX678) defaults, installed as /date/ap_cameragimbal/camera.ini
# on first boot and then preserved across appfs updates.

[general]
# Built-in IANA name (see timezones/zones.txt). GMT is UTC+0.
timezone = GMT

[mavlink]
# 0 adopts the first flight controller heartbeat system ID; 1..255 fixes it.
system_id = 0
camera_component_id = 100
position_targeting = false
tcp_port = 14550
udp_port = 14550

[recording]
# false: manual, true: start at app startup, while_armed: follow MAVLink arming
autorecord = false
resolution = 3840x2160

[stream.main]
# rtsp://CAMERA:8554/video1, also the recording encoder
resolution = 3840x2160
codec = h264
# 0 picks 12 Mbit/s at 2160p, 4 Mbit/s at 1080p and 2 Mbit/s below.
bitrate_kbps = 0
frame_rate = 30
# 30..10000 ms between keyframes, rounded to whole frames at the frame rate.
# Shorter recovers from loss sooner but costs picture quality at a fixed bitrate.
keyframe_interval_ms = 1000
# Largest key frame in times a P-frame (1..100); 0 keeps the encoder's limit.
max_iframe_ratio = 0
# Send each RTSP client at most this many Mbit/s, never below twice the
# bitrate, so a 4K key frame takes ~100 ms instead of one line-rate burst.
# 0 sends at once.
rtp_pacing_mbps = 60

[stream.sub]
# rtsp://CAMERA:8554/video2
resolution = 1280x720
codec = h264
keyframe_interval_ms = 1000
max_iframe_ratio = 0
rtp_pacing_mbps = 0

[image]
# Tuned on the ROV. Bayer TNR off against ghosting behind moving objects;
# max_exposure 30 caps auto exposure at 1/30 s (one frame at 30 fps).
saturation = 40
sharpness = 64
max_gain = 64
max_again = 255
max_exposure = 30
tnr = false

[network]
# true also takes a DHCP lease; eth0 keeps 192.168.2.10 (from updatetype.ini)
# either way. Applies within a second of saving.
dhcp = false
