# camera-app configuration
#
# Hi3516DV500 (IMX678) defaults, installed as /date/ap_cameragimbal/camera.ini
# on first boot and then preserved across appfs updates.

[general]
# Built-in IANA name (see timezones/zones.txt). GMT is UTC+0.
timezone = GMT

[mavlink]
# 0 adopts the first flight controller heartbeat system ID; 1..255 fixes it.
system_id = 0
camera_component_id = 100
position_targeting = false
tcp_port = 14550
udp_port = 14550

[recording]
# false: manual, true: start at app startup, while_armed: follow MAVLink arming
autorecord = false
resolution = 3840x2160

[stream.main]
# rtsp://CAMERA:8554/video1, also the recording encoder
resolution = 3840x2160
codec = h264
# 0 picks 12 Mbit/s at 2160p, 4 Mbit/s at 1080p and 2 Mbit/s below.
bitrate_kbps = 0
frame_rate = 30

[stream.sub]
# rtsp://CAMERA:8554/video2
resolution = 1280x720
codec = h264
